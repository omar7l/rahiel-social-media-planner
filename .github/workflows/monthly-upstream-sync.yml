name: Monthly upstream sync

on:
  schedule:
    - cron: '15 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: monthly-upstream-sync
  cancel-in-progress: false

jobs:
  propose-sync:
    name: Propose upstream changes without changing main or latest
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream into a review branch and open a PR
        run: |
          pending=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName,url --jq '.[] | select(.headRefName | startswith("sync/upstream-")) | .url')
          if [ -n "$pending" ]; then
            echo "An upstream sync already awaits review: $pending" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream https://github.com/gitroomhq/postiz-app.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "Fork already includes upstream/main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          baseline=$(git rev-parse origin/main)
          upstream=$(git rev-parse upstream/main)
          branch="sync/upstream-${upstream:0:12}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
          else
            git checkout -b "$branch" origin/main
            git merge --no-edit upstream/main
            git push origin "HEAD:refs/heads/$branch"
          fi
          cat > /tmp/upstream-sync-body.md <<'BODY'
          Updates upstream code on a review branch. This workflow does not change main or publish an image.

          Review database SQL, populated-database upgrade results, release notes, optional environment settings and protected Rahiel files before merging. A database-affecting release cannot update latest without manual database-review and backup confirmations.
          BODY
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Sync upstream Postiz (${upstream:0:12})" --body-file /tmp/upstream-sync-body.md
          # GITHUB_TOKEN-created PRs do not trigger another automatic workflow.
          # An explicit dispatch runs checks on the proposed branch's commit.
          gh workflow run database-upgrade-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f baseline_ref="$baseline"
